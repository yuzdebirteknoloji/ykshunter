<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YKS Hunter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fafafa;
      font-family: system-ui, -apple-system, Roboto, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0; }
    p { color: #a1a1aa; margin: 0; max-width: 320px; line-height: 1.5; }
    button { margin-top: 8px; padding: 12px 24px; border: 0; border-radius: 10px;
      background: #6366f1; color: white; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div style="font-size:56px">📡</div>
    <h1>Bağlantı kurulamadı</h1>
    <p>YKS Hunter'a ulaşılamıyor. İnternet bağlantını kontrol edip tekrar dene.</p>
    <button onclick="history.back(); setTimeout(function(){ location.reload() }, 300)">Tekrar dene</button>
  </main>
</body>
</html>
