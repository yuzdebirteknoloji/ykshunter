name: Android APK

# v2.1.0 gibi bir tag atıldığında APK derlenip GitHub Releases'a yüklenir.
# Actions sekmesinden elle de çalıştırılabilir (APK artifact olarak indirilir).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Repo Settings > Secrets and variables > Actions > Variables: CAP_SERVER_URL
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://ykshunter.vercel.app' }}
      APP_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Sürüm adını belirle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=2.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npx cap sync android

      - name: İmzalama anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok, debug imzalı APK üretilecek."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ykshunter-${APP_VERSION_NAME}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ykshunter-${APP_VERSION_NAME}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ykshunter-${{ env.APP_VERSION_NAME }}
          path: ykshunter-*.apk

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ykshunter-*.apk
          generate_release_notes: true
          body: |
            ## 📱 Kurulum
            1. Aşağıdaki `ykshunter-${{ env.APP_VERSION_NAME }}.apk` dosyasını telefondan indir.
            2. Açarken "Bilinmeyen kaynaklardan yüklemeye izin ver" uyarısı çıkarsa izin ver.
            3. Uygulamayı aç, davet kodunla kayıt ol.
