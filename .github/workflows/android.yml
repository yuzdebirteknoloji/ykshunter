name: Android APK

# v2.1.0 gibi bir tag atıldığında APK derlenip GitHub Releases'a yüklenir.
# Actions sekmesinden elle de çalıştırılabilir (APK artifact olarak indirilir).
# Geliştirme branch'lerine push'ta da derlenir (Release oluşturmadan, sadece artifact).
on:
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/**'
      - 'packages/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # ---- Web uygulamasını çevrimdışı (statik) derle ----
      - name: Web bağımlılıkları
        working-directory: .
        run: npm ci

      - name: Gömülü içeriği hazırla (görseller indirilir)
        working-directory: .
        run: |
          if ls mobile/content-source/*.json mobile/content-source/*.csv >/dev/null 2>&1; then
            npm run content:prepare -- mobile/content-source
          else
            echo "::warning::mobile/content-source boş, APK içeriksiz başlayacak."
          fi

      - name: Statik web derlemesi
        working-directory: .
        run: npm run build:mobile

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest'te Android SDK hazır kurulu (ANDROID_HOME); eksik platformları Gradle kendisi indirir.

      - name: Sürüm adını belirle
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "DO_RELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$COMMIT_MSG" == *"[release]"* ]]; then
            # Commit mesajında [release] varsa mobile/package.json'daki sürümle Release oluşturulur
            echo "APP_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
            echo "DO_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=2.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "DO_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npx cap sync android

      - name: İmzalama anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok, debug imzalı APK üretilecek."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ykshunter-${APP_VERSION_NAME}.apk"
            # Sabit isimli kopya: .../releases/latest/download/ykshunter.apk hep son sürümü indirir
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ykshunter.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ykshunter-${APP_VERSION_NAME}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ykshunter.apk"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ykshunter-${{ env.APP_VERSION_NAME }}
          path: ykshunter-${{ env.APP_VERSION_NAME }}.apk

      - name: GitHub Release oluştur
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: YKS Hunter ${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ykshunter-${{ env.APP_VERSION_NAME }}.apk
            ykshunter.apk
          generate_release_notes: true
          body: |
            ## 📱 Kurulum
            1. Aşağıdaki `ykshunter-${{ env.APP_VERSION_NAME }}.apk` dosyasını telefondan indir.
            2. Açarken "Bilinmeyen kaynaklardan yüklemeye izin ver" uyarısı çıkarsa izin ver.
            3. Uygulama tamamen çevrimdışı çalışır; veriler sadece telefonda saklanır.
               **Ayarlar → Verilerim → Yedek al** ile ara sıra yedek al.
